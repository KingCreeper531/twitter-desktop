<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Settings</title>
<style>
  :root { --bg: #121212; --panel: #1b1b1b; --line: #2a2a2a; --text: #f1f1f1; --muted: #a0a0a0; --accent: #3d8bfd; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 "Segoe UI", system-ui, sans-serif; }
  main { padding: 20px 22px 28px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 18px; font-size: 13px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 4px 16px; margin-bottom: 14px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 12px 0 2px; }
  label.row, .row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 11px 0; border-top: 1px solid var(--line); }
  label.row { cursor: pointer; }
  h2 + .row { border-top: 0; }
  .row small { display: block; color: var(--muted); font-size: 12px; }
  input[type=checkbox] { appearance: none; width: 38px; height: 22px; border-radius: 11px; background: #444; position: relative; flex: none; cursor: pointer; transition: background .15s; margin: 0; }
  input[type=checkbox]::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left .15s; }
  input[type=checkbox]:checked { background: var(--accent); }
  input[type=checkbox]:checked::after { left: 19px; }
  :focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  button { background: #2a2a2a; color: var(--text); border: 1px solid #3a3a3a; padding: 7px 12px; border-radius: 6px; font: inherit; cursor: pointer; }
  button:hover { background: #333; }
  button.green { background: #1ed760; border-color: #1ed760; color: #04210f; font-weight: 600; }
  button.green:hover { background: #1bc456; }
  button:disabled { opacity: .7; cursor: default; }
  kbd { font: 12px/1 Consolas, monospace; background: #262626; border: 1px solid #333; border-bottom-width: 2px; border-radius: 4px; padding: 2px 5px; }
  .foot { color: var(--muted); font-size: 12px; text-align: center; margin-top: 8px; }
</style>
</head>
<body>
<main>
  <h1 id="name">Settings</h1>
  <p class="sub">Changes apply right away. Open this with the gear button or <kbd>Ctrl</kbd> <kbd>,</kbd>. The Ranch Launcher can change these too.</p>
  <div id="groups"></div>

  <section>
    <h2>Updates</h2>
    <div class="row">
      <span><span id="upver">Version …</span><small id="upstatus"></small></span>
      <span style="display:flex; gap:8px">
        <button id="upcheck">Check for updates</button>
        <button id="upinstall" class="green" hidden>Update</button>
      </span>
    </div>
  </section>

  <section>
    <h2>Account</h2>
    <div class="row"><span>Sign out and clear app data<small>Removes your sign-in and everything the site saved in this app</small></span><button id="clear">Clear</button></div>
  </section>
  <p class="foot" id="ver"></p>
</main>
<script>
  let built = false;
  function build(schema) {
    const root = document.getElementById('groups');
    let section = null;
    for (const s of schema) {
      if (s.group) {
        section = document.createElement('section');
        const h = document.createElement('h2');
        h.textContent = s.group;
        section.appendChild(h);
        root.appendChild(section);
        continue;
      }
      if (s.type !== 'toggle' || !section) continue;
      const l = document.createElement('label');
      l.className = 'row';
      const span = document.createElement('span');
      span.textContent = s.label;
      if (s.help) { const sm = document.createElement('small'); sm.textContent = s.help; span.appendChild(sm); }
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.dataset.key = s.key;
      cb.addEventListener('change', async () => render(await tunebox.set({ [s.key]: cb.checked })));
      l.append(span, cb);
      section.appendChild(l);
    }
    built = true;
  }
  function render(res) {
    if (!res) return;
    if (!built && res.schema) build(res.schema);
    if (res.name) { document.getElementById('name').textContent = res.name; document.title = res.name + ' Settings'; }
    document.querySelectorAll('input[data-key]').forEach((el) => { el.checked = !!res.config[el.dataset.key]; });
    if (res.version) document.getElementById('ver').textContent = (res.name || '') + ' ' + res.version;
  }
  async function refresh() { render(await tunebox.get()); }

  function renderUpdate(s) {
    if (!s) return;
    document.getElementById('upver').textContent = 'Version ' + s.current;
    const text = {
      dev: 'Updates are checked in the installed app only',
      idle: '', checking: 'Checking…', latest: 'You\'re up to date',
      available: 'Version ' + s.version + ' is available',
      downloading: 'Downloading… ' + (s.percent || 0) + '%',
      ready: 'Version ' + s.version + ' is ready to install',
      error: 'Couldn\'t update: ' + (s.error || 'unknown error'),
    }[s.status] || '';
    document.getElementById('upstatus').textContent = text;
    const btn = document.getElementById('upinstall');
    btn.hidden = !(['available', 'downloading', 'ready'].includes(s.status) || (s.status === 'error' && s.version));
    btn.disabled = s.status === 'downloading';
    btn.textContent = s.status === 'downloading' ? 'Updating… ' + (s.percent || 0) + '%'
      : s.status === 'ready' ? 'Restart to update' : s.status === 'error' ? 'Retry update' : 'Update to ' + s.version;
    document.getElementById('upcheck').disabled = ['checking', 'downloading'].includes(s.status);
  }
  tunebox.onUpdate(renderUpdate);
  tunebox.updateGet().then(renderUpdate);
  document.getElementById('upcheck').addEventListener('click', async () => renderUpdate(await tunebox.updateCheck()));
  document.getElementById('upinstall').addEventListener('click', () => tunebox.updateInstall());
  document.getElementById('clear').addEventListener('click', async () => {
    if (confirm('Sign out and clear all of this app\'s data?')) await tunebox.clearData();
  });
  refresh();
  setInterval(refresh, 3000);
</script>
</body>
</html>
